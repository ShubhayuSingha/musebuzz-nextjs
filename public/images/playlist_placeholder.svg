<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12072B" />
      <stop offset="50%" stop-color="#0A0612" />
      <stop offset="100%" stop-color="#030008" />
    </linearGradient>

    <!-- Vibrant Purple Accents -->
    <linearGradient id="pl-purple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Base Disc / Badge Sheen -->
    <radialGradient id="pl-sheen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24133D" />
      <stop offset="70%" stop-color="#11091C" />
      <stop offset="95%" stop-color="#07020D" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Soft Ambient Glow -->
    <filter id="pl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Square Canvas -->
  <rect width="500" height="500" rx="36" fill="url(#pl-bg)" />
  <rect width="496" height="496" x="2" y="2" rx="34" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Ambient Purple Halo -->
  <circle cx="250" cy="250" r="140" fill="#7928CA" opacity="0.22" filter="url(#pl-glow)" />

  <!-- Outer Orbit & Accent Rings -->
  <circle cx="250" cy="250" r="162" fill="none" stroke="#2E1065" stroke-width="2" />
  <circle cx="250" cy="250" r="156" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.06" />

  <!-- Inner Badge Surface -->
  <circle cx="250" cy="250" r="150" fill="url(#pl-sheen)" stroke="url(#pl-purple)" stroke-width="2" stroke-opacity="0.6" />

  <!-- Playlist Stacks & Connected Music Note -->
  <g filter="url(#pl-glow)" fill="url(#pl-purple)">
    <!-- Top Horizontal Track Bar -->
    <rect x="180" y="180" width="140" height="12" rx="6" />

    <!-- Middle Horizontal Track Bar -->
    <rect x="180" y="212" width="140" height="12" rx="6" />

    <!-- Bottom Shorter Track Bar -->
    <rect x="180" y="244" width="85" height="12" rx="6" />

    <!-- Integrated Play / Eighth Note Accent -->
    <!-- Stem -->
    <rect x="290" y="244" width="10" height="62" rx="5" />
    <!-- Note Head -->
    <ellipse cx="278" cy="308" rx="22" ry="16" transform="rotate(-20 278 308)" />
    <!-- Top Note Flag / Beam Hook -->
    <path d="M290 244 C290 244 316 244 326 268 C316 262 300 262 290 266 Z" />
  </g>
</svg>