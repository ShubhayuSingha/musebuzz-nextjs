<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12072B" />
      <stop offset="50%" stop-color="#0A0612" />
      <stop offset="100%" stop-color="#030008" />
    </linearGradient>

    <!-- Glowing Cyber / AI Accents -->
    <linearGradient id="cyber-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="30%" stop-color="#A855F7" />
      <stop offset="70%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Radial disc sheen -->
    <radialGradient id="ai-sheen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24133D" />
      <stop offset="70%" stop-color="#11091C" />
      <stop offset="95%" stop-color="#07020D" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Seamless Natural Bloom Filter -->
    <filter id="soft-neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="wideBlur" />
      <feGaussianBlur stdDeviation="5" result="midBlur" />
      <feMerge>
        <feMergeNode in="wideBlur" />
        <feMergeNode in="midBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ambient background wash filter -->
    <filter id="ambient-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28" />
    </filter>
  </defs>

  <!-- Base Square Canvas -->
  <rect width="500" height="500" rx="36" fill="url(#ai-bg)" />
  <rect width="496" height="496" x="2" y="2" rx="34" fill="none" stroke="url(#cyber-glow)" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Background Ambient Glow (Seamless, no hard boundaries) -->
  <circle cx="250" cy="250" r="130" fill="#A855F7" opacity="0.16" filter="url(#ambient-blur)" />
  <circle cx="250" cy="250" r="100" fill="#06B6D4" opacity="0.10" filter="url(#ambient-blur)" />

  <!-- Orbiting Badge Rings & Audio Tech Details -->
  <circle cx="250" cy="250" r="162" fill="none" stroke="#2E1065" stroke-width="2" />
  <!-- Dotted Digital Ring -->
  <circle cx="250" cy="250" r="154" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="2 6" stroke-opacity="0.3" />

  <!-- Inner Disc Surface -->
  <circle cx="250" cy="250" r="146" fill="url(#ai-sheen)" stroke="url(#cyber-glow)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Digital AI Sparkles & Nodes (Background Particles) -->
  <g opacity="0.75">
    <!-- Tiny Sparkles -->
    <path d="M 170 145 Q 170 152 177 152 Q 170 152 170 159 Q 170 152 163 152 Q 170 152 170 145 Z" fill="#06B6D4" />
    <path d="M 330 145 Q 330 152 337 152 Q 330 152 330 159 Q 330 152 323 152 Q 330 152 330 145 Z" fill="#EC4899" />
    <path d="M 315 350 Q 315 355 320 355 Q 315 355 315 360 Q 315 355 310 355 Q 315 355 315 350 Z" fill="#A855F7" opacity="0.8" />
    <!-- Data Orbit Dots -->
    <circle cx="150" cy="290" r="2.5" fill="#06B6D4" />
    <circle cx="342" cy="220" r="2.5" fill="#7928CA" />
  </g>

  <!-- Central Emblem with Seamless Multi-Layer Bloom -->
  <g filter="url(#soft-neon-glow)">
    <!-- Main Infinity Ribbon -->
    <path d="M 250 250 
             C 215 200, 150 200, 150 250 
             C 150 300, 215 300, 250 250 
             C 285 200, 350 200, 350 250 
             C 350 300, 285 300, 250 250 Z" fill="none" stroke="url(#cyber-glow)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Waveform Spikes (Audio Pulses) -->
    <path d="M 170 250 L 176 238 L 182 262 L 188 226 L 195 274 L 202 236 L 209 258 L 216 244 L 222 252 L 228 248" fill="none" stroke="#EC4899" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <path d="M 272 252 L 278 246 L 284 256 L 291 238 L 298 266 L 305 224 L 312 276 L 318 238 L 324 262 L 330 250" fill="none" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Musical Notes Integrated with Wave -->
    <path d="M 244 140 C 244 143, 248 143, 253 141 L 253 158 C 248 159, 244 157, 244 162 C 244 167, 249 168, 252 168 C 257 168, 259 164, 259 156 L 259 146 Q 262 143, 271 144 L 271 138 C 263 138, 244 133, 244 140 Z" fill="url(#cyber-glow)" />
    <path d="M 242 344 C 242 341, 238 341, 233 343 L 233 326 C 238 325, 242 327, 242 322 C 242 317, 237 316, 234 316 C 229 316, 227 320, 227 328 L 227 338 Q 224 341, 215 340 L 215 346 C 223 346, 242 351, 242 344 Z" fill="#A855F7" />
  </g>
</svg>