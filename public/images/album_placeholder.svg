<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12072B" />
      <stop offset="50%" stop-color="#0A0612" />
      <stop offset="100%" stop-color="#030008" />
    </linearGradient>

    <!-- Vibrant Purple Accents -->
    <linearGradient id="purple-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Vinyl Disc Shimmer -->
    <radialGradient id="vinyl-sheen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24133D" />
      <stop offset="70%" stop-color="#11091C" />
      <stop offset="95%" stop-color="#07020D" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Square Canvas -->
  <rect width="500" height="500" rx="36" fill="url(#bg-grad)" />
  <rect width="496" height="496" x="2" y="2" rx="34" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Background Ambient Glow -->
  <circle cx="250" cy="250" r="140" fill="#7928CA" opacity="0.25" filter="url(#glow-blur)" />

  <!-- Vinyl Record Base -->
  <g transform="translate(250, 250)">
    <!-- Main Disc -->
    <circle r="170" fill="url(#vinyl-sheen)" stroke="#2E1065" stroke-width="2" />

    <!-- Subtle Grooves -->
    <circle r="152" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05" />
    <circle r="138" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.07" />
    <circle r="124" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04" />
    <circle r="110" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.06" />
    <circle r="96" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05" />

    <!-- Outer Center Label Ring -->
    <circle r="68" fill="none" stroke="url(#purple-glow)" stroke-width="2" opacity="0.6" />

    <!-- Center Label -->
    <circle r="62" fill="#0A0518" stroke="#3B0764" stroke-width="1.5" />

    <!-- Stylized Musical Note / Soundwave Centerpiece -->
    <path d="M-10 18 C-10 24 -15 28 -22 28 C-29 28 -34 23 -34 16 C-34 9 -28 5 -20 5 C-17 5 -13 6 -10 8 L-10 -16 C-10 -20 -7 -23 -3 -24 L16 -28 C21 -29 25 -26 25 -21 L25 10 C25 16 20 20 13 20 C6 20 1 15 1 8 C1 1 7 -3 15 -3 C18 -3 21 -2 23 0 L23 -16 L-10 -9 Z" fill="url(#purple-glow)" filter="url(#glow-blur)" />
  </g>
</svg>